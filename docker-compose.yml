version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcore-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankcore_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bankcore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bankcore}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankcore-net

  redis:
    image: redis:7-alpine
    container_name: bankcore-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-bankcore_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-bankcore_redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankcore-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bankcore-keycloak
    restart: unless-stopped
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankcore}
      KC_DB_USERNAME: ${POSTGRES_USER:-bankcore}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bankcore_secret}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bankcore-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: bankcore-zookeeper
    restart: unless-stopped
    ports:
      - '${ZOOKEEPER_PORT:-2181}:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - bankcore-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: bankcore-kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bankcore-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bankcore-rabbitmq
    restart: unless-stopped
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bankcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bankcore_rabbit}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bankcore-net

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  rabbitmq_data:

networks:
  bankcore-net:
    driver: bridge
